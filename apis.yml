aid: moveinsync
name: MoveInSync
description: >-
  MoveInSync is an enterprise employee-commute and workplace-management SaaS
  platform. It automates end-to-end corporate transportation — fixed-route
  shuttles, flexi rideshare, on-demand campus rides, corporate carpool, parking
  management, and the WorkInSync hybrid-workplace suite — with smart routing,
  live tracking, safety workflows, and billing. The platform serves more than
  1M commuters across 100,000+ vehicles in 39 countries for 400+ enterprises,
  including 112+ Fortune 500 companies. MoveInSync exposes a JWT-authenticated
  REST and webhook integration API at api.moveinsync.com, including the Rentlz
  booking-management APIs used by external transport vendors. Backed by Bessemer
  Venture Partners.
