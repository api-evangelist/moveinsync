apis:
- name: MoveInSync Integration API
  description: >-
    JWT-authenticated REST and webhook API for employee-transport integration.
    Partners authenticate at api.moveinsync.com/auth/token (OAuth2
    client-credentials over HTTP Basic) to obtain a 24-hour JWT, then call the
    APIs and receive webhooks with it as a Bearer token. Includes the Rentlz
    booking-management APIs for external transport vendors (cab/driver
    assignment, driver-event logging, booking accept/reject).
  humanURL: https://helpcenter.moveinsync.com/support/solutions
  baseURL: https://api.moveinsync.com
